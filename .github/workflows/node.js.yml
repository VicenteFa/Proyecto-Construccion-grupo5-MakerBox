name: CI/CD Pipeline MakerBox

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "MiApp-GitHub-Deploy"
  BACKEND_PACKAGE_PATH: "./backend"
  FRONTEND_PACKAGE_PATH: "./frontend"
  NODE_VERSION: "22.x"

permissions:
  contents: read
  id-token: write

# JOB 1: LINT BACKEND
jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar cliente Prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Ejecutar Linter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run lint -- --fix

  # JOB 2: LINT FRONTEND
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PACKAGE_PATH }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint -- --fix

  # JOB 3: TESTS UNITARIOS
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar cliente Prisma
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npx prisma generate

      - name: Ejecutar tests unitarios con cobertura
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npm run test:cov -- --testPathPatterns="(auth.service|auth.controller|auth.guard|usuarios.service.unit|usuarios.controller|impresiones.service|impresiones.controller|reservas.controller|ayudantias.controller|cursos.controller|inventario.controller|app.controller)"

      - name: Subir reporte de cobertura unitaria
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: backend/coverage/

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-unit-backend
          flags: unit
          directory: ./backend/coverage/

  # JOB 4: TESTS DE INTEGRACION
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: polUser
          POSTGRES_PASSWORD: polito123
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npm ci

      - name: Migrar base de datos de prueba
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npx prisma db push --accept-data-loss

      - name: Ejecutar tests de integración con cobertura
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npm run test:cov -- --testPathPatterns="(usuarios.service.spec)"

      - name: Subir reporte de cobertura integración
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage-report
          path: backend/coverage/

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-integration-backend
          flags: integration
          directory: ./backend/coverage/

  # JOB 5: TESTS FRONTEND
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PACKAGE_PATH }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y cobertura
        run: npm run test:cov

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-frontend
          flags: frontend
          directory: ./frontend/coverage/

  # JOB 6: PRUEBAS DE CARGA K6
  load-tests:
    name: K6 Load Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
        run: npm ci

      - name: Migrar DB de test
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
        run: npx prisma db push --accept-data-loss

      - name: Compilar, iniciar backend y preparar datos
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npm run build:nest
          npm run start &
          echo "Esperando al backend..."
          for i in {1..15}; do
            if curl -s http://localhost:3000/api > /dev/null; then
              echo "Backend listo!"
              break
            fi
            sleep 2
          done
          curl -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"rut":"99999999-9","nombre":"Test","apellido":"QA","correo":"testqa@utalca.cl","passUsuario":"testqa123"}'
          TOKEN=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"correo":"testqa@utalca.cl","passUsuario":"testqa123"}' | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          echo "K6_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Instalar k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Ejecutar prueba de carga (load test)
        run: k6 run load-tests/load-test.js

      - name: Ejecutar prueba de picos (spike test)
        run: k6 run -e K6_TOKEN=$K6_TOKEN load-tests/load-test-spike.js

      - name: Subir reportes de k6
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports
          path: |
            backend/load-tests/reporte.html
            backend/load-tests/reporte-spike.html

  # JOB 7: BUILD BACKEND
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [integration-tests]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar y construir Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npm run build:nest

      - name: Subir artefacto del Backend
        uses: actions/upload-artifact@v4
        with:
          name: node-app-backend
          path: |
            ${{ env.BACKEND_PACKAGE_PATH }}/dist
            ${{ env.BACKEND_PACKAGE_PATH }}/prisma
            ${{ env.BACKEND_PACKAGE_PATH }}/prisma.config.ts
            ${{ env.BACKEND_PACKAGE_PATH }}/package.json
            ${{ env.BACKEND_PACKAGE_PATH }}/package-lock.json
  # JOB 8: BUILD FRONTEND
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-frontend]
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PACKAGE_PATH }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar y construir Frontend
        run: |
          npm ci
          npm run build --if-present

      - name: Subir artefacto del Frontend
        uses: actions/upload-artifact@v4
        with:
          name: node-app-frontend
          path: ${{ env.FRONTEND_PACKAGE_PATH }}/dist

  # JOB 9: DEPLOY A AZURE
  deploy:
    name: Deploy to Azure (CD)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, load-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Descargar artefacto del Backend
        uses: actions/download-artifact@v4
        with:
          name: node-app-backend
          path: ./app-final

      - name: Descargar artefacto del Frontend
        uses: actions/download-artifact@v4
        with:
          name: node-app-frontend
          path: ./app-final/dist/client

      - name: Iniciar sesión en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar Fullstack a Azure WebApp
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./app-final
