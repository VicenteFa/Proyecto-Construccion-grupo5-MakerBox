# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: CI Pipeline MakerBox

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build-backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Ejecutar Linter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npm run lint -- --fix

      - name: Subir Reporte, Backend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-backend
          path: backend/coverage/

  build-frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Subir reporte de Frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-frontend
          path: frontend/coverage/

  load-tests:
    name: K6 Load Tests
    runs-on: ubuntu-latest
    needs: [build-backend]
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb" # ← agregado
        run: npm ci

      - name: Migrar DB de test
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
        run: npx prisma db push --accept-data-loss

      - name: Compilar, Iniciar backend y preparar datos
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npm run build:nest
          npm run start &
          echo "Esperando al backend..."
          for i in {1..15}; do
            if curl -s http://localhost:3000/api > /dev/null; then
              echo "Backend listo!"
              break
            fi
            sleep 2
          done
          curl -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"rut":"99999999-9","nombre":"Test","apellido":"QA","correo":"testqa@utalca.cl","passUsuario":"testqa123"}'
          TOKEN=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"correo":"testqa@utalca.cl","passUsuario":"testqa123"}' | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          echo "K6_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Instalar k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Ejecutar prueba de carga (load test)
        run: k6 run load-tests/load-test.js

      - name: Ejecutar prueba de picos (spike test)
        run: k6 run -e K6_TOKEN=$K6_TOKEN load-tests/load-test-spike.js

      - name: Subir reportes de k6
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports
          path: |
            backend/load-tests/reporte.html
            backend/load-tests/reporte-spike.html
