name: CI/CD Pipeline MakerBox

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "MiApp-GitHub-Deploy"
  BACKEND_PACKAGE_PATH: "./backend"
  FRONTEND_PACKAGE_PATH: "./frontend"
  NODE_VERSION: "22.x"

permissions:
  contents: read
  id-token: write

jobs:
  # Analisis estatico: detecta errores de estilo
  ci-calidad-backend:
    name: "CI · Backend Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Instalar dependencias del proyecto"
        run: npm ci --ignore-scripts

      - name: "Generar cliente Prisma (ORM de base de datos)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: "Ejecutar Linter"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run lint -- --fix

  ci-calidad-frontend:
    name: "CI · Frontend Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PACKAGE_PATH }}

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Instalar dependencias del proyecto"
        run: npm ci

      - name: "Ejecutar Linter"
        run: npm run lint -- --fix

  # Pruebas unitarias: validan cada funcion y
  # modulo del backend de forma aislada.
  ci-pruebas-unitarias:
    name: "CI · Pruebas unitarias — Backend"
    runs-on: ubuntu-latest
    needs: [ci-calidad-backend]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Instalar dependencias del proyecto"
        run: npm ci --ignore-scripts

      - name: "Generar cliente Prisma (ORM de base de datos)"
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npx prisma generate

      - name: "Ejecutar pruebas unitarias y medir cobertura"
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npm run test:cov -- --testPathPatterns="(auth.service|auth.controller|auth.guard|usuarios.service.unit|usuarios.controller|impresiones.service|impresiones.controller|reservas.controller|ayudantias.controller|cursos.controller|inventario.controller|app.controller)"

      - name: "Guardar reporte de cobertura como artefacto"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: backend/coverage/

      - name: "Publicar cobertura en Codecov"
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-unit-backend
          flags: unit
          directory: ./backend/coverage/

  # Pruebas de integración: verifican que los
  # modulos funcionan correctamente entre si
  # usando una base de datos PostgreSQL real
  ci-pruebas-integracion:
    name: "CI · Pruebas de integración — Backend + BD"
    runs-on: ubuntu-latest
    needs: [ci-pruebas-unitarias]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: polUser
          POSTGRES_PASSWORD: polito123
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Instalar dependencias del proyecto"
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npm ci

      - name: "Aplicar esquema de BD al entorno de pruebas (Prisma)"
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npx prisma db push --accept-data-loss

      - name: "Ejecutar pruebas de integración y medir cobertura"
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npm run test:cov -- --testPathPatterns="(usuarios.service.spec)"

      - name: "Guardar reporte de cobertura como artefacto"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage-report
          path: backend/coverage/

      - name: "Publicar cobertura en Codecov"
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-integration-backend
          flags: integration
          directory: ./backend/coverage/

  # Pruebas del frontend: validan componentes
  # y lógica de la interfaz de usuario.
  ci-pruebas-frontend:
    name: "CI · Pruebas y cobertura — Frontend"
    runs-on: ubuntu-latest
    needs: [ci-calidad-frontend]
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PACKAGE_PATH }}

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Instalar dependencias del proyecto"
        run: npm ci

      - name: "Ejecutar pruebas y medir cobertura"
        run: npm run test:cov

      - name: "Publicar cobertura en Codecov"
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-frontend
          flags: frontend
          directory: ./frontend/coverage/

  # Pruebas de rendimiento: simulan carga real
  ci-pruebas-rendimiento:
    name: "CI · Pruebas de rendimiento — K6 (carga y picos)"
    runs-on: ubuntu-latest
    needs: [ci-pruebas-integracion]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Instalar dependencias del proyecto"
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
        run: npm ci

      - name: "Aplicar esquema de BD al entorno de pruebas (Prisma)"
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
        run: npx prisma db push --accept-data-loss

      - name: "Compilar backend e iniciar servidor de pruebas"
        env:
          DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npm run build:nest
          npm run start &
          echo "Esperando al backend..."
          for i in {1..15}; do
            if curl -s http://localhost:3000/api > /dev/null; then
              echo "Backend listo!"
              break
            fi
            sleep 2
          done
          curl -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"rut":"99999999-9","nombre":"Test","apellido":"QA","correo":"testqa@utalca.cl","passUsuario":"testqa123"}'
          TOKEN=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"correo":"testqa@utalca.cl","passUsuario":"testqa123"}' | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          echo "K6_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: "Instalar herramienta de pruebas de rendimiento (k6)"
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: "Ejecutar prueba de carga sostenida"
        run: k6 run load-tests/load-test.js

      - name: "Ejecutar prueba de picos de tráfico"
        run: k6 run -e K6_TOKEN=$K6_TOKEN load-tests/load-test-spike.js

      - name: "Guardar reportes HTML de k6 como artefactos"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-rendimiento-reportes
          path: |
            backend/load-tests/reporte.html
            backend/load-tests/reporte-spike.html

  # Compilación del backend: genera el artefacto
  ci-compilar-backend:
    name: "CI · Compilar y empaquetar — Backend"
    runs-on: ubuntu-latest
    needs: [ci-pruebas-integracion]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Instalar dependencias e instalar cliente Prisma"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci --ignore-scripts
          npx prisma generate

      - name: "Compilar backend (NestJS → JavaScript)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build:nest

      - name: "Subir artefacto de backend listo para producción"
        uses: actions/upload-artifact@v4
        with:
          name: artefacto-backend-produccion
          path: |
            ${{ env.BACKEND_PACKAGE_PATH }}/dist
            ${{ env.BACKEND_PACKAGE_PATH }}/prisma
            ${{ env.BACKEND_PACKAGE_PATH }}/prisma.config.ts
            ${{ env.BACKEND_PACKAGE_PATH }}/package.json
            ${{ env.BACKEND_PACKAGE_PATH }}/package-lock.json

  # Compilacion del frontend:
  ci-compilar-frontend:
    name: "CI · Compilar y empaquetar — Frontend"
    runs-on: ubuntu-latest
    needs: [ci-pruebas-frontend]
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PACKAGE_PATH }}

    steps:
      - name: "Obtener código fuente del repositorio"
        uses: actions/checkout@v4

      - name: "Configurar entorno Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Instalar dependencias del proyecto"
        run: npm ci

      - name: "Compilar frontend (React/Vite → archivos estáticos)"
        run: npm run build --if-present

      - name: "Subir artefacto de frontend listo para producción"
        uses: actions/upload-artifact@v4
        with:
          name: artefacto-frontend-produccion
          path: ${{ env.FRONTEND_PACKAGE_PATH }}/dist

  #  Objetivo: desplegar automaticamente a Azure
  #  solo cuando todos los pasos de CI pasan
  # Toma los artefactos aprobados por CI y los
  # despliega automa en Azure.
  cd-despliegue-produccion:
    name: "CD · Despliegue automático en Azure"
    runs-on: ubuntu-latest
    needs: [ci-compilar-backend, ci-compilar-frontend, ci-pruebas-rendimiento]
    if: github.event_name == 'push'

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: "Descargar artefacto de backend aprobado por CI"
        uses: actions/download-artifact@v4
        with:
          name: artefacto-backend-produccion
          path: ./app-final

      - name: "Descargar artefacto de frontend aprobado por CI"
        uses: actions/download-artifact@v4
        with:
          name: artefacto-frontend-produccion
          path: ./app-final/dist/client

      - name: "Autenticarse en Azure con credenciales seguras (OIDC)"
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "Desplegar aplicación fullstack en Azure Web App"
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./app-final

      - name: "Despliegue completado — aplicación disponible en producción"
        run: |
          echo "✓ MakerBox desplegado exitosamente en Azure: ${{ env.AZURE_WEBAPP_NAME }}"
