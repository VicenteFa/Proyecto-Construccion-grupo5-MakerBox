name: Deploy Fullstack to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Te permite ejecutarlo manualmente desde GitHub

env:
  # ⚙️ Nombres de tus aplicaciones en Azure
  AZURE_WEBAPP_NAME_BACKEND: 'tu-app-backend-en-azure'
  AZURE_WEBAPP_NAME_FRONTEND: 'tu-app-frontend-en-azure'
  
  # 📂 Rutas a tus carpetas en el repositorio
  BACKEND_PACKAGE_PATH: './backend'
  FRONTEND_PACKAGE_PATH: './frontend'
  
  # 🟢 Versiones de Node.js (basado en tu CI previo)
  NODE_VERSION_BACKEND: '22.x'
  NODE_VERSION_FRONTEND: '20.x'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------
  # 1. BUILD BACKEND
  # ---------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_PACKAGE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for Backend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_BACKEND }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_PACKAGE_PATH }}/package-lock.json

      - name: Instalar y Construir Backend
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Subir artefacto del Backend
        uses: actions/upload-artifact@v4
        with:
          name: node-app-backend
          path: ${{ env.BACKEND_PACKAGE_PATH }}

  # ---------------------------------------------------
  # 2. BUILD FRONTEND
  # ---------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PACKAGE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_FRONTEND }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_PACKAGE_PATH }}/package-lock.json

      - name: Instalar y Construir Frontend
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Subir artefacto del Frontend
        uses: actions/upload-artifact@v4
        with:
          name: node-app-frontend
          path: ${{ env.FRONTEND_PACKAGE_PATH }}

  # ---------------------------------------------------
  # 3. DEPLOY BACKEND
  # ---------------------------------------------------
  deploy-backend:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build-backend
    environment:
      name: 'Production-Backend'
      url: ${{ steps.deploy-to-webapp-backend.outputs.webapp-url }}

    steps:
      - name: Descargar artefacto del Backend
        uses: actions/download-artifact@v4
        with:
          name: node-app-backend
          path: ${{ env.BACKEND_PACKAGE_PATH }}

      - name: Desplegar Backend a Azure WebApp
        id: deploy-to-webapp-backend
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: ${{ env.BACKEND_PACKAGE_PATH }}

  # ---------------------------------------------------
  # 4. DEPLOY FRONTEND
  # ---------------------------------------------------
  deploy-frontend:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build-frontend
    environment:
      name: 'Production-Frontend'
      url: ${{ steps.deploy-to-webapp-frontend.outputs.webapp-url }}

    steps:
      - name: Descargar artefacto del Frontend
        uses: actions/download-artifact@v4
        with:
          name: node-app-frontend
          path: ${{ env.FRONTEND_PACKAGE_PATH }}

      - name: Desplegar Frontend a Azure WebApp
        id: deploy-to-webapp-frontend
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_FRONTEND }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: ${{ env.FRONTEND_PACKAGE_PATH }}
