# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # JOB 1: TESTS UNITARIOS
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar cliente Prisma
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npx prisma generate

      - name: Ejecutar tests unitarios
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npm run test:cov -- --testPathPatterns="(auth.service|auth.controller|auth.guard|usuarios.service.unit|usuarios.controller|impresiones.service|impresiones.controller|reservas.controller|ayudantias.controller|cursos.controller|inventario.controller|app.controller)"

      - name: Subir reporte de cobertura unitaria
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: backend/coverage/

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-unit-backend
          flags: unit
          directory: ./backend/coverage/

  # JOB 2: TESTS DE integracion
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: polUser
          POSTGRES_PASSWORD: polito123
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npm ci

      - name: Migrar base de datos de prueba
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: npx prisma db push --accept-data-loss

      - name: Ejecutar tests de integración
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npm run test:cov -- --testPathPattern="(usuarios.service.spec)"

      - name: Subir reporte de cobertura integración
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage-report
          path: backend/coverage/

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-integration-backend
          flags: integration
          directory: ./backend/coverage/

  # ─JOB 3: de FRONTEND
  build-frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint -- --fix

      - name: Ejecutar pruebas y cobertura
        run: npm run test:cov

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-frontend
          flags: frontend
          directory: ./frontend/coverage/
