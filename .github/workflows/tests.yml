# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-backend:
    name: Backend Check
    runs-on: ubuntu-latest
    
    # base de datos temporal para pruebas de integracion
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: polUser
          POSTGRES_PASSWORD: polito123
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        env:
          # base de datos local temporal para generar el cliente
          DATABASE_URL: "postgresql://polUser:polito123@localhost:5432/testdb"
        run: |
          npx prisma generate
          npm run lint

      - name: Ejecutar pruebas y cobertura
        env:
          # conectar tests de integracion al contenedor l ocal
          DATABASE_URL: "postgresql://polUser:polito123@localhost:5432/testdb"
        run: |
          # 4. Sincronizar el esquema de Prisma con el contenedor vacío antes de probar
          npx prisma db push --accept-data-loss
          npm run test:cov

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-backend
          flags: backend
          directory: ./backend/coverage/

  build-frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint -- --fix

      - name: Ejecutar pruebas y cobertura
        run: npm run test:cov

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-frontend
          flags: frontend
          directory: ./frontend/coverage/
