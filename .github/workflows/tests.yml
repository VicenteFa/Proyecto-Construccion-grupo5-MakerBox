# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-backend:
    name: Backend Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: polUser
          POSTGRES_PASSWORD: polito123
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npx prisma generate
          npm run lint
      - env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
        run: |
          npx prisma db push --accept-data-loss
          npm run test:cov
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-backend
          flags: backend
          directory: ./backend/coverage/

  build-frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --fix
      - run: npm run test:cov
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: reporte-frontend
          flags: frontend
          directory: ./frontend/coverage/

  performance-backend:
    name: Perf Load Test - Backend (k6)
    needs: build-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: polUser
          POSTGRES_PASSWORD: polito123
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Iniciar BD y Backend
        env:
          DATABASE_URL: "postgresql://polUser:polito123@127.0.0.1:5432/testdb"
          PORT: 3000
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run start &
          npx wait-on http://localhost:3000/api/auth/login --timeout 30000
      - name: Ejecutar k6 (Backend)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: backend/test/load-test.js
        env:
          BASE_URL: "http://localhost:3000/api"
      - name: Guardar Reporte HTML Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-backend-report
          path: summary.html
          retention-days: 7

  performance-frontend:
    name: Perf Load Test - Frontend (k6)
    needs: build-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Construir y Servir Frontend
        run: |
          npm run build
          npm run preview & 
          npx wait-on http://localhost:4173 --timeout 30000
      - name: Ejecutar k6 (Frontend)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: frontend/test/load-test.js
        env:
          BASE_URL: "http://localhost:4173"
      - name: Guardar Reporte HTML Frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-frontend-report
          path: summary.html
          retention-days: 7
